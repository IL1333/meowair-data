name: Update flight data

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch global flight data
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, datetime, time

          POINTS = [
              (22.32, 114.17), (35.55, 139.78), (31.14, 121.81), (37.47, 126.45),
              (1.36, 103.99), (25.25, 55.36), (51.47, -0.45), (49.01, 2.55),
              (50.03, 8.56), (40.64, -73.78), (33.94, -118.41), (41.97, -87.91),
              (-33.95, 151.18), (-23.43, -46.47), (30.12, 31.41), (28.57, 77.10),
          ]

          all_ac = {}
          for lat, lon in POINTS:
              for attempt in range(2):
                  try:
                      req = urllib.request.Request(
                          f'https://api.adsb.lol/v2/point/{lat}/{lon}/250',
                          headers={'User-Agent': 'MeowAir/1.0'})
                      with urllib.request.urlopen(req, timeout=25) as r:
                          d = json.loads(r.read())
                      for a in d.get('ac', []):
                          if a.get('hex') and a.get('lat') and a.get('lon'):
                              all_ac[a['hex']] = a
                      break
                  except Exception as e:
                      print(f'({lat},{lon}) attempt {attempt+1}: {e}')
                      time.sleep(2)
              time.sleep(1)

          ac_list = list(all_ac.values())[:800]
          out = {
              'updated': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'source': 'adsb.lol',
              'ac': ac_list,
          }
          with open('flights.json', 'w') as f:
              json.dump(out, f)
          print(f'saved {len(ac_list)} aircraft')
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "meowair-bot"
          git config user.email "meowair-bot@1333lab.com"
          git add flights.json
          git diff --staged --quiet || (git commit -m "Update flight data" && git push)

